<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIFHE Support</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
  <div class="logo">VIFHE<span> SUPPORT</span></div>
  <div class="divider"></div>
  <span class="tag">ask anything about VIFHE</span>
  <div class="status" id="status">
    <span class="dot" id="status-dot"></span>
    <span id="status-text">connecting...</span>
  </div>
</header>

<div class="banner">
  <span class="banner-icon">&#9432;</span>
  <span>Ask questions about VIFHE &mdash; programs, admissions, fees, policies</span>
  <button class="banner-close" id="banner-close" title="Dismiss">&times;</button>
</div>

<aside>
  <div class="aside-header">
    <h2>Knowledge Base</h2>
    <span class="badge" id="vec-badge">0 vectors</span>
  </div>

  <div class="doc-list" id="doc-list"></div>
</aside>

<main>
  <div class="chat-area" id="chat-area">
    <div class="empty-state" id="empty-state">
      <div class="empty-mark">&#8292;</div>
      <p class="empty-title">Ask anything about VIFHE</p>
      <p class="empty-sub">programs &middot; admissions &middot; fees &middot; policies</p>
    </div>
  </div>

  <div class="input-bar">
    <div class="query-wrap">
      <textarea id="query" rows="1" placeholder="Ask a question about VIFHE&hellip;" maxlength="2000"></textarea>
    </div>
    <button class="send-btn" id="send-btn" title="Send (Enter)">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
